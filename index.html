<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<meta name="description" content="Notícias do mundo dos carros esportivos, atualizadas automaticamente.">
<title>CX Car Notícias</title>
<link rel="icon" href="logo.png">
<link rel="preload" as="image" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#141518;--line:#34363c;--text:#f4f4f2;--mute:#b4b7bd;--acc:#ff4d46;--red:#c8102e;--hd:'Cormorant Garamond',Georgia,serif;--bd:'Jost','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:300 16px/1.6 var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:flex-end;padding:calc(18px + env(safe-area-inset-top,0px)) clamp(20px,5vw,64px) 28px;background:linear-gradient(#0c0d0fd9,#0c0d0f00);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);cursor:pointer;padding:0;font:600 24px/1 var(--hd);pointer-events:auto}
.brand img{width:56px;height:auto;display:block}
.brand span{opacity:0;transition:opacity .6s ease}
.brand.on span{opacity:1}
.panel{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;padding:clamp(24px,6vw,80px);padding-bottom:calc(clamp(24px,6vw,80px) + 8px);overflow:hidden;isolation:isolate;background:radial-gradient(110% 90% at 70% 20%,#4a4d54,#1f2023 60%,#0c0d0f)}
.panel.r{justify-content:flex-end;text-align:right}
.panel .art{position:absolute;inset:0;overflow:hidden}
.panel .art img,.panel .art svg{width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,#0c0d0ff0 8%,#0c0d0f00 70%)}
.panel .txt{position:relative;z-index:2;max-width:780px}
.panel .cred{z-index:3;left:auto;right:0}
.art{background:#050505;overflow:hidden;position:relative}
.cred{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.7);color:#bdbdbd;font-size:11px;padding:3px 8px}
.cred a{text-decoration:underline}
.art svg{display:block;width:100%;height:auto}
.art img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute)}
.panel.r .meta{justify-content:flex-end}
.meta b{color:var(--text);font-weight:500}
h1,h2,h3{font-family:var(--hd);font-weight:500;margin:0;text-wrap:balance;overflow-wrap:break-word}
.panel h1{font-size:clamp(2.6rem,8vw,6rem);line-height:1.02;margin-top:16px;max-width:18ch}
.panel h2{font-size:clamp(2rem,5.5vw,4rem);line-height:1.06;margin-top:16px;max-width:22ch}
.panel.r h2{margin-left:auto}
.rule{width:72px;height:1px;background:var(--red);margin:26px 0}
.panel.r .rule{margin-left:auto}
.panel p{margin:0;color:var(--mute);font-size:1.08rem;max-width:46ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel.r p{margin-left:auto}
.panel:hover h1,.panel:hover h2,.card:hover h3{color:var(--acc)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.bar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin:72px 0 28px;border-top:1px solid var(--red);padding-top:18px}
.bar[hidden]{display:none}
.chip{font:400 15px var(--bd);background:none;color:var(--mute);border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer}
.chip[aria-pressed=true]{color:var(--text);border-bottom-color:var(--red)}
.chip:hover{color:var(--text)}
input[type=search]{-webkit-appearance:none;appearance:none;margin-left:auto;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:5px 0;font:300 15px var(--bd);width:min(100%,200px);border-radius:0}
input[type=search]:focus{border-bottom-color:var(--red);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:40px 24px}
.card .art{margin-bottom:12px}
.card h3{font-size:1.7rem;line-height:1.1;margin-top:6px}
.empty{padding:30px 0;color:var(--mute)}
footer{margin-top:80px;padding:26px 0 34px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
#introBg{position:fixed;inset:0;background:var(--bg);z-index:50}
#introLogo{position:fixed;inset:0;margin:auto;width:min(60vw,260px);height:auto;z-index:51;clip-path:inset(0 100% 0 0)}
.off{display:none}
@media(max-width:600px){input[type=search]{margin-left:0;width:100%}}
</style>
<noscript><style>#introBg,#introLogo{display:none}body.lock{overflow:auto}.brand span{opacity:1}</style></noscript>
</head>
<body class="lock">
<div id="introBg"></div>
<img id="introLogo" src="logo.png" alt="">
<header class="top">
<button class="brand" id="brand" title="Rever animação de entrada" aria-label="CX Car Notícias"><img id="brandLogo" src="logo.png" alt="CX"><span id="brandTxt">Car Notícias</span></button>
</header>
<main>
<div id="panels"></div>
<div class="wrap">
<div class="bar" id="bar"><div id="chips" style="display:flex;gap:22px;flex-wrap:wrap"></div><input type="search" id="q" placeholder="Buscar" aria-label="Buscar notícia"></div>
<section class="grid" id="grid" aria-label="Mais notícias"></section>
</div>
</main>
<footer><div class="wrap">Cada notícia leva para a página da fonte original. Fotos: <a href="https://unsplash.com/?utm_source=cx_car_noticias&utm_medium=referral" target="_blank" rel="noopener" style="text-decoration:underline">Unsplash</a>.</div></footer>
<script>
let NEWS=[
{c:'Supercarros',t:'Cupê de 800 cv aposta em câmbio manual e tração traseira',s:'O novo esportivo mira quem quer volante e pedais sem filtro, com produção limitada.',f:'Fonte exemplo A',h:2},
{c:'Fórmula 1',t:'Equipes testam novo pacote aerodinâmico antes da próxima etapa',s:'Mudanças no assoalho prometem mais estabilidade em curvas de alta velocidade.',f:'Fonte exemplo B',h:4},
{c:'Elétricos',t:'Esportivo elétrico bate recorde de volta em circuito europeu',s:'O tempo ficou abaixo dos rivais a combustão da mesma faixa de preço.',f:'Fonte exemplo A',h:6},
{c:'Lançamentos',t:'Hatch esportivo ganha versão com 300 cv e suspensão ajustável',s:'Pacote inclui freios maiores e modo pista com controle de tração menos intrusivo.',f:'Fonte exemplo C',h:9},
{c:'Clássicos',t:'Leilão reúne esportivos dos anos 90 com preços em alta',s:'Modelos com pouca quilometragem e histórico completo lideram as ofertas.',f:'Fonte exemplo B',h:13},
{c:'Tuning',t:'Preparação leve: como ganhar desempenho sem perder confiabilidade',s:'Mapeamento, admissão e escape são o ponto de partida mais comum entre preparadores.',f:'Fonte exemplo C',h:20},
{c:'Fórmula 1',t:'Estreante surpreende e termina a corrida entre os dez primeiros',s:'Estratégia de pneus foi decisiva para a posição final do piloto novato.',f:'Fonte exemplo A',h:27},
{c:'Supercarros',t:'Marca italiana mostra o sucessor de seu ícone de motor V12',s:'Híbrido, mais leve e com som que promete manter a tradição.',f:'Fonte exemplo B',h:31},
{c:'Elétricos',t:'Nova bateria promete recarga rápida sem perder fôlego em pista',s:'Fabricante diz que o sistema aguenta voltas seguidas sem queda de potência.',f:'Fonte exemplo C',h:40}
];
function car(i){
 const k=i%3,red=k!==1,body=red?'#e10600':'#1c1c1c',ang=[-18,12,-6][k],x=[120,40,200][k];
 return `<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Imagem de exemplo de carro esportivo"><rect width="300" height="150" fill="#050505"/><g transform="skewX(${ang})"><rect x="${x}" y="-10" width="46" height="170" fill="#e10600" opacity=".85"/><rect x="${x+58}" y="-10" width="10" height="170" fill="#e10600" opacity=".5"/></g><rect y="112" width="300" height="38" fill="#0e0e0e"/><path d="M22 106 L28 90 Q44 80 84 76 L116 54 Q136 44 176 44 L212 48 Q240 56 256 74 L282 80 Q294 84 294 106 Z" fill="${body}" stroke="#ff4d46" stroke-width="1.5"/><path d="M122 58 Q138 50 172 50 L204 53 Q224 60 236 74 L112 74 Z" fill="#0a0a0a" stroke="#333"/><circle cx="82" cy="108" r="19" fill="#0a0a0a" stroke="#555" stroke-width="2"/><circle cx="82" cy="108" r="8" fill="#888"/><circle cx="232" cy="108" r="19" fill="#0a0a0a" stroke="#555" stroke-width="2"/><circle cx="232" cy="108" r="8" fill="#888"/><text x="10" y="142" font-family="Arial,sans-serif" font-size="9" fill="#777">imagem de exemplo</text></svg>`}

const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safe=u=>{if(!u)return '';try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const ago=h=>!isFinite(h)||h<1?'agora':h<24?'há '+h+' h':'há '+Math.round(h/24)+' d';
let cat='Todas';
function art(n,i,eager){return n.img?`<img src="${esc(n.img)}" alt="" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async">${n.cr?`<div class="cred">Foto: <a href="${esc(n.crl||'https://unsplash.com')}" target="_blank" rel="noopener">${esc(n.cr)}</a> / <a href="${esc(n.ffl||'https://unsplash.com')}" target="_blank" rel="noopener">${esc(n.ff||'Unsplash')}</a></div>`:''}`:car(i)}
function href(n){return n.u?`href="${esc(n.u)}" target="_blank" rel="noopener"`:'href="#" onclick="return false"'}
function panel(n,i){
 const T=i?'h2':'h1';
 return `<article class="panel${i===1?' r':''}"><div class="art">${art(n,i,i===0)}</div><div class="shade"></div><div class="txt"><div class="meta"><b>${esc(n.c)}</b><span>${ago(n.h)}</span><span>${esc(n.f)}</span></div><${T}><a ${href(n)}>${esc(n.t)}</a></${T}><div class="rule"></div><p>${esc(n.s)}</p></div></article>`}
function render(){
 const q=$('#q').value.trim().toLowerCase();
 const rest=NEWS.slice(3);
 const list=rest.filter(n=>(cat==='Todas'||n.c===cat)&&(n.t+' '+n.s).toLowerCase().includes(q));
 $('#grid').innerHTML=list.length?list.map(n=>`<article class="card"><div class="art">${art(n,NEWS.indexOf(n))}</div><div class="meta"><b>${esc(n.c)}</b><span>${ago(n.h)}</span><span>${esc(n.f)}</span></div><h3><a ${href(n)}>${esc(n.t)}</a></h3></article>`).join(''):(rest.length?'<p class="empty">Nenhuma notícia encontrada. Tente outra palavra ou escolha “Todas”.</p>':'');
}
function build(){
 $('#panels').innerHTML=NEWS.slice(0,3).map(panel).join('');
 $('#bar').hidden=NEWS.length<4;
 const cats=['Todas',...new Set(NEWS.slice(3).map(n=>n.c))];
 if(!cats.includes(cat))cat='Todas';
 $('#chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 render();
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#q').oninput=render;
build();
fetch('noticias.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
 const arr=Array.isArray(d)?d:d&&d.noticias;
 if(!Array.isArray(arr))return;
 const l=arr.map(x=>{
  const tm=Date.parse(x.data),ok=isFinite(tm);
  return {c:x.categoria||'Notícias',t:x.titulo,s:x.resumo||'',f:x.fonte||'',u:safe(x.link),img:safe(x.imagem),cr:x.credito,crl:safe(x.credito_link),ff:x.fonte_foto,ffl:safe(x.fonte_foto_link),h:ok?Math.max(0,Math.round((Date.now()-tm)/36e5)):0,d:ok?tm:0}
 }).filter(x=>x.t);
 if(l.length){l.sort((a,b)=>b.d-a.d);NEWS=l;build()}
}).catch(()=>{});

const SOMB64='';
const SOMP=SOMB64?Promise.resolve(Uint8Array.from(atob(SOMB64),x=>x.charCodeAt(0)).buffer):fetch('som.mp3').then(r=>r.ok&&/audio|octet/.test(r.headers.get('content-type')||'')?r.arrayBuffer():null).catch(()=>null);
function noise(c,sec){const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
function curve(k){const n=2048,a=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;a[i]=(1+k)*x/(1+k*Math.abs(x))}return a}
function synth(c){try{
 const t=c.currentTime,end=t+2.9;
 const comp=c.createDynamicsCompressor();comp.connect(c.destination);
 const m=c.createGain();m.gain.setValueAtTime(0,t);m.gain.linearRampToValueAtTime(.7,t+.12);m.gain.setValueAtTime(.7,t+1.9);m.gain.exponentialRampToValueAtTime(.001,end-.1);m.connect(comp);
 const rev=(p,k)=>{p.setValueAtTime(70*k,t);p.exponentialRampToValueAtTime(380*k,t+1.45);p.exponentialRampToValueAtTime(130*k,t+2.6)};
 const sh=c.createWaveShaper();sh.curve=curve(30);sh.oversample='2x';
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.5;lp.frequency.setValueAtTime(350,t);lp.frequency.exponentialRampToValueAtTime(2600,t+1.45);lp.frequency.exponentialRampToValueAtTime(700,t+2.6);
 const mod=c.createGain();mod.gain.value=.75;
 const lfo=c.createOscillator(),ld=c.createGain();ld.gain.value=.25;rev(lfo.frequency,.5);lfo.connect(ld).connect(mod.gain);lfo.start(t);lfo.stop(end);
 [['sawtooth',1,0,.3],['sawtooth',1,14,.3],['square',.5,0,.25]].forEach(([ty,k,det,v])=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;o.detune.value=det;rev(o.frequency,k);g.gain.value=v;o.connect(g).connect(sh);o.start(t);o.stop(end)});
 sh.connect(lp);lp.connect(mod);mod.connect(m);
 const n=noise(c,3),nl=c.createBiquadFilter(),ng=c.createGain();nl.type='lowpass';nl.frequency.value=500;ng.gain.value=.18;n.connect(nl).connect(ng).connect(m);n.start(t);
 const w=c.createOscillator(),wg=c.createGain();w.type='sine';w.frequency.setValueAtTime(1500,t+.2);w.frequency.exponentialRampToValueAtTime(5200,t+1.5);
 wg.gain.setValueAtTime(0,t+.2);wg.gain.linearRampToValueAtTime(.03,t+1.4);wg.gain.setValueAtTime(.03,t+1.5);wg.gain.exponentialRampToValueAtTime(.001,t+1.9);w.connect(wg).connect(m);w.start(t);w.stop(t+2);
 const p=noise(c,1.2),pb=c.createBiquadFilter(),pg=c.createGain();pb.type='bandpass';pb.frequency.value=2200;pb.Q.value=.6;
 pg.gain.setValueAtTime(0,t+1.5);for(let k=0;k<3;k++){pg.gain.linearRampToValueAtTime(.4,t+1.52+k*.08);pg.gain.linearRampToValueAtTime(.08,t+1.56+k*.08)}
 pg.gain.linearRampToValueAtTime(.35,t+1.78);pg.gain.exponentialRampToValueAtTime(.001,t+2.4);p.connect(pb).connect(pg).connect(m);p.start(t+1.5);
}catch(e){}}
function sound(c){SOMP.then(buf=>{if(buf){c.decodeAudioData(buf.slice(0)).then(b=>{const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.3;s.connect(g).connect(c.destination);s.start()}).catch(()=>synth(c))}else synth(c)})}
let AC=null,T0=0;
function newCtx(){try{AC&&AC.close&&AC.close()}catch(e){}try{const C=window.AudioContext||window.webkitAudioContext;AC=C?new C():null}catch(e){AC=null}return AC}
function unlock(){if(!AC||AC.state==='running')return;if(performance.now()-T0<9000)AC.resume();else{try{AC.close()}catch(e){}}}
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,unlock,{passive:true}));

const iL=$('#introLogo'),iB=$('#introBg'),bL=$('#brandLogo'),br=$('#brand'),bd=document.body;
function end(){iL.classList.add('off');iB.classList.add('off');bL.style.opacity=1;br.classList.add('on');bd.classList.remove('lock')}
function play(){
 window.scrollTo(0,0);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){end();return}
 iL.getAnimations().forEach(a=>a.cancel());iB.getAnimations().forEach(a=>a.cancel());
 T0=performance.now();const c=newCtx();if(c){try{c.resume().catch(()=>{})}catch(e){}sound(c)}
 iL.classList.remove('off');iB.classList.remove('off');iL.style.clipPath='';
 bd.classList.add('lock');bL.style.opacity=0;br.classList.remove('on');iB.style.opacity=1;
 iL.animate([{clipPath:'inset(0 100% 0 0)',opacity:.4,filter:'blur(6px)'},{clipPath:'inset(0 0% 0 0)',opacity:1,filter:'blur(0)'}],{duration:1100,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'}).finished.then(()=>new Promise(r=>setTimeout(r,400))).then(()=>{
  const s=iL.getBoundingClientRect(),t=bL.getBoundingClientRect();
  const dx=t.left+t.width/2-(s.left+s.width/2),dy=t.top+t.height/2-(s.top+s.height/2),k=t.width/s.width;
  iB.animate([{opacity:1},{opacity:0}],{duration:900,easing:'ease',fill:'forwards'});
  return iL.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(${k})`}],{duration:900,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'}).finished;
 }).then(end).catch(end);
}
br.onclick=play;
setTimeout(()=>{if(bd.classList.contains('lock'))end()},9000);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){end()}
else Promise.race([Promise.all([document.fonts?document.fonts.ready:0,SOMP]),new Promise(r=>setTimeout(r,1500))]).then(play);
</script>
</body>
</html>
