name: Atualizar noticias
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 atualizar_noticias.py
      - name: Salvar se mudou
        run: |
          git config user.name "cx-car-bot"
          git config user.email "bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Atualiza noticias" && git push)
